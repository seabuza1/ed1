# Publica a Edge Function ler-comanda (com a foto de exemplo, que não cabe no deploy pelo MCP).
# Precisa do secret SUPABASE_ACCESS_TOKEN no repositório (Settings → Secrets and variables →
# Actions). Roda sozinho quando a função muda na main, ou à mão em Actions → Run workflow.
name: Função ler-comanda

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez, na ordem: um push antigo não termina depois do novo.
concurrency:
  group: funcao-ler-comanda
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJETO: ueahsvfmbpthujnvmahl
      # Só diz se o token existe; o token em si vai apenas para o passo que publica.
      TEM_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - name: Sem token, não publica
        if: env.TEM_TOKEN != 'true'
        run: echo "::notice::Cadastre o secret SUPABASE_ACCESS_TOKEN para publicar a função."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: env.TEM_TOKEN == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: env.TEM_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm

      # Adaptadores, prompt e schema testados antes de ir para produção.
      - name: Testar a leitura
        if: env.TEM_TOKEN == 'true'
        run: |
          npm ci
          npx vitest run src/domain/iaLeitura.node.test.ts src/domain/promptLeitura.node.test.ts

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        if: env.TEM_TOKEN == 'true'
        with:
          version: 2.120.0

      - name: Publicar
        if: env.TEM_TOKEN == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ler-comanda --project-ref "$PROJETO"
